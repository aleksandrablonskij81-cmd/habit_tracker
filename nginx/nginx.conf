server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=10s;  # 👈 DNS Docker

    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/media/;
    }

    location / {
        set $upstream_web web;  # 👈 переменная
        proxy_pass http://$upstream_web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}